name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [release, static]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Build with warnings as errors
        run: make ${{ matrix.mode }} CXXFLAGS=-Werror
      - name: Check static linkage
        if: matrix.mode == 'static'
        run: |
          file baudsh
          if readelf -l baudsh | grep -q INTERP; then
            echo "The static binary unexpectedly requires a dynamic loader."
            exit 1
          fi
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Check whitespace
        run: git -c core.whitespace=cr-at-eol show --format= --check HEAD

  windows:
    name: Windows (MSVC x64)
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Build with the static C++ runtime
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b %errorlevel%
          cl /nologo /std:c++17 /EHsc /W4 /WX /O2 /MT /D_CRT_SECURE_NO_WARNINGS baudsh_main.cpp baudsh_win.cpp /Fe:baudsh.exe
          if errorlevel 1 exit /b %errorlevel%
      - name: Run native Windows regression tests
        run: python -m unittest discover -s tests -v
      - name: Preserve tested Windows executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baudsh-windows-x64-tested
          path: baudsh.exe
          if-no-files-found: error
          retention-days: 7

  ci:
    name: CI passed
    if: always()
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require all platform tests to pass
        env:
          LINUX_RESULT: ${{ needs.linux.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: test "$LINUX_RESULT" = success && test "$WINDOWS_RESULT" = success
