# ------------------------------------------------------------
# baudsh configuration file
# All values shown explicitly.
# Lines starting with '#' or ';' are comments.
# Format supports either:
#   key=value
#   key value
# ------------------------------------------------------------

# ---------------------------
# Serial / framing parameters
# ---------------------------

baud=9600                # Baud rate (integer, e.g. 300–115200+)
data-bits=8              # 5, 6, 7, or 8
parity=e                 # n (none), e (even), o (odd)
stop-bits=1              # 1, 1.5 or 2

# ---------------------------
# Throttling behaviour
# ---------------------------

burst-ms=100             # Burst duration in milliseconds
                         # Larger = chunkier throughput
                         # Smaller = smoother but more CPU wakeups

# ---------------------------
# Exit handling
# ---------------------------

exit-key=ctrl+f7         # Key sequence to trigger exit arm
                         # Examples:
                         #   ctrl+f7
                         #   ctrl+]
                         #   ctrl+q
                         #   none

exit-arm-ms=300          # Time window (ms) to confirm exit

# ------------------------------------------------------------
# End of file
# ------------------------------------------------------------
